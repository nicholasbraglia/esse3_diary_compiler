<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario Docente Automator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; line-height: 1.6; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="date"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #4285F4; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; }
        button:hover { background-color: #357AE8; }
        .success { color: green; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Sincronizzazione Diario Docente</h2>

        {% if message %}
            <div style="padding: 15px; margin-bottom: 20px; border-radius: 5px; {% if success %}background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;{% else %}background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;{% endif %}">
                <strong>{{ message }}</strong>

                {% if errors %}
                    <ul style="margin-top: 10px; margin-bottom: 0;">
                        {% for error in errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            </div>
        {% endif %}

        <p>Seleziona il range di tempo in cui sono presenti gli eventi da analizzare da Google Calendar</p>

        <form action="{% url 'google_login' %}" method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="start_date">Data di inizio:</label>
                <input type="date" id="start_date" name="start_date" required>
            </div>

            <div class="form-group">
                <label for="end_date">Data di fine:</label>
                <input type="date" id="end_date" name="end_date" required>
            </div>

            <button type="submit">Accedi a Google & Analizza</button>
        </form>
    </div>

</body>
</html>
